# Power and idle behaviour for a kiosk box.
#
# A short power-button press must not shut the machine down mid-game, but a
# long press should still work for an adult. Lid, suspend and hibernate are
# all ignored: this machine has no lid and should never sleep.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
NAutoVTs=1
